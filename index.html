<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking Global 🏆</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .contenedor {
            max-width: 500px;
            margin: 0 auto;
        }

        .tarjeta {
            background: white;
            border-radius: 20px;
            padding: 30px 25px;
            margin-bottom: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            text-align: center;
        }

        h1 { color: #333; font-size: 26px; margin-bottom: 20px; }
        h2 { color: #333; font-size: 20px; margin-bottom: 15px; }

        .emoji { font-size: 60px; margin-bottom: 15px; }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: block;
            border: 3px solid #667eea;
            object-fit: cover;
        }

        .nombre-usuario {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .email-usuario {
            font-size: 13px;
            color: #999;
            margin-bottom: 20px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            transition: transform 0.1s;
        }

        button:active { transform: scale(0.96); }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .boton-google {
            background: white;
            color: #333;
            border: 2px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .boton-google:hover {
            border-color: #667eea;
        }

        .boton-secundario {
            background: #f0f0f0;
            color: #666;
            font-size: 14px;
            padding: 12px;
        }

        .contador-grande {
            font-size: 60px;
            font-weight: bold;
            color: #667eea;
            margin: 15px 0;
        }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }

        th, td {
            padding: 12px 8px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            color: #999;
            font-size: 12px;
            text-transform: uppercase;
        }

        td { color: #333; font-size: 15px; }

        .posicion { font-weight: bold; width: 40px; }
        .pos-1 { color: #FFD700; font-size: 20px; }
        .pos-2 { color: #C0C0C0; font-size: 20px; }
        .pos-3 { color: #CD7F32; font-size: 20px; }

        .puntos {
            text-align: right;
            font-weight: bold;
            color: #667eea;
        }

        .vacio {
            text-align: center;
            color: #999;
            padding: 30px 0;
            font-style: italic;
        }

        .estado {
            font-size: 12px;
            color: #4CAF50;
            margin-top: 10px;
            text-align: center;
        }

        .estado-error { color: #E53935; }

        .avatar-tabla {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            vertical-align: middle;
            margin-right: 8px;
            object-fit: cover;
        }

        .cargando {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="contenedor">

        <!-- PANTALLA DE LOGIN -->
        <div class="tarjeta" id="pantallaLogin">
            <div class="emoji">🏆</div>
            <h1>Ranking Global</h1>
            <p style="color: #666; margin-bottom: 25px; font-size: 15px;">
                Inicia sesión con tu cuenta de Google para participar en el ranking global.
            </p>

            <button class="boton-google" onclick="iniciarSesionGoogle()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="24" height="24">
                Iniciar sesión con Google
            </button>

            <div class="estado" id="estado">Listo para iniciar sesión</div>
        </div>

        <!-- PANTALLA DE JUEGO -->
        <div class="tarjeta" id="pantallaJuego" style="display: none;">
            <img class="avatar" id="avatarUsuario" src="" alt="">
            <div class="nombre-usuario" id="nombreUsuario">Cargando...</div>
            <div class="email-usuario" id="emailUsuario"></div>
            
            <div class="contador-grande" id="contadorActual">0</div>
            
            <button id="botonClick" onclick="darClick()">¡CLICK! 👆</button>
            <button class="boton-secundario" onclick="cerrarSesion()">
                Cerrar sesión
            </button>

            <div class="estado" id="estadoJuego">✅ Conectado</div>
        </div>

        <!-- TABLA DE POSICIONES -->
        <div class="tarjeta">
            <h2>🏆 Tabla Global</h2>
            <div id="tablaContenedor">
                <div class="vacio">Cargando ranking global...</div>
            </div>
        </div>

    </div>

    <!-- SDK de Firebase (versión modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } 
            from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, get, set, onValue } 
            from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Tu configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyA-bJisA0TwUnzrpOoibSjysnt42Df0tlg",
            authDomain: "ranking-clicks.firebaseapp.com",
            databaseURL: "https://ranking-clicks-default-rtdb.firebaseio.com",
            projectId: "ranking-clicks",
            storageBucket: "ranking-clicks.firebasestorage.app",
            messagingSenderId: "970683274988",
            appId: "1:970683274988:web:c04b141e23b767cd6977c9"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);
        const proveedorGoogle = new GoogleAuthProvider();

        let usuarioActual = null;
        let jugadores = {};
        let contadorActual = 0;

        // --- FUNCIÓN AUXILIAR: Genera un SVG con la inicial del nombre ---
        function generarAvatarInicial(nombre) {
            const inicial = nombre ? nombre.charAt(0).toUpperCase() : '?';
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80">
                <defs>
                    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
                    </linearGradient>
                </defs>
                <circle cx="40" cy="40" r="40" fill="url(#grad)"/>
                <text x="50%" y="55%" font-size="36" fill="white" text-anchor="middle" 
                      font-family="Arial" font-weight="bold" dominant-baseline="middle">${inicial}</text>
            </svg>`;
            return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
        }

        // --- FUNCIÓN AUXILIAR: Carga la foto con fallback ---
        function cargarAvatar(elemento, urlFoto, nombre) {
            elemento.onerror = function() {
                this.onerror = null;
                this.src = generarAvatarInicial(nombre);
            };
            
            if (urlFoto && urlFoto.trim() !== '') {
                elemento.src = urlFoto;
            } else {
                elemento.src = generarAvatarInicial(nombre);
            }
        }

        // --- INICIO DE SESIÓN CON GOOGLE ---
        window.iniciarSesionGoogle = async function() {
            try {
                document.getElementById('estado').textContent = 'Iniciando sesión...';
                await signInWithPopup(auth, proveedorGoogle);
            } catch (error) {
                console.error('Error de login:', error);
                document.getElementById('estado').textContent = '❌ Error al iniciar sesión';
                document.getElementById('estado').className = 'estado estado-error';
                alert('Error al iniciar sesión: ' + error.message);
            }
        };

        // --- CERRAR SESIÓN ---
        window.cerrarSesion = async function() {
            if (confirm('¿Seguro que quieres cerrar sesión?')) {
                try {
                    await signOut(auth);
                } catch (error) {
                    console.error('Error al cerrar sesión:', error);
                }
            }
        };

        // --- DETECTAR CAMBIO DE SESIÓN ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                usuarioActual = user;
                mostrarPantallaJuego(user);
                cargarRanking();
            } else {
                usuarioActual = null;
                mostrarPantallaLogin();
                cargarRanking();
            }
        });

        function mostrarPantallaJuego(user) {
            document.getElementById('pantallaLogin').style.display = 'none';
            document.getElementById('pantallaJuego').style.display = 'block';
            
            const avatarElement = document.getElementById('avatarUsuario');
            cargarAvatar(avatarElement, user.photoURL, user.displayName);
            
            document.getElementById('nombreUsuario').textContent = user.displayName || 'Usuario';
            document.getElementById('emailUsuario').textContent = user.email || '';
            
            actualizarContador();
        }

        function mostrarPantallaLogin() {
            document.getElementById('pantallaLogin').style.display = 'block';
            document.getElementById('pantallaJuego').style.display = 'none';
            document.getElementById('estado').textContent = 'Listo para iniciar sesión';
            document.getElementById('estado').className = 'estado';
        }

        // --- DAR CLICK ---
        window.darClick = async function() {
            if (!usuarioActual) {
                alert('Debes iniciar sesión primero');
                return;
            }

            contadorActual++;
            document.getElementById('contadorActual').textContent = contadorActual;

            const puntosActuales = jugadores[usuarioActual.uid]?.puntos || 0;
            const nuevosPuntos = puntosActuales + 1;

            try {
                const refJugador = ref(database, 'jugadores/' + usuarioActual.uid);
                await set(refJugador, {
                    nombre: usuarioActual.displayName || 'Usuario',
                    foto: usuarioActual.photoURL || '',
                    puntos: nuevosPuntos
                });
            } catch (error) {
                console.error('Error al guardar:', error);
                document.getElementById('estadoJuego').textContent = '❌ Error al guardar';
                document.getElementById('estadoJuego').className = 'estado estado-error';
            }
        };

        // --- CARGAR RANKING EN TIEMPO REAL ---
        function cargarRanking() {
            const refRanking = ref(database, 'jugadores');
            
            onValue(refRanking, (snapshot) => {
                jugadores = snapshot.val() || {};
                mostrarTabla();
                actualizarContador();
                
                if (usuarioActual) {
                    document.getElementById('estadoJuego').textContent = '✅ Conectado';
                    document.getElementById('estadoJuego').className = 'estado';
                }
            }, (error) => {
                console.error('Error al cargar:', error);
                document.getElementById('estado').textContent = '❌ Error de conexión';
                document.getElementById('estado').className = 'estado estado-error';
            });
        }

        function actualizarContador() {
            if (usuarioActual && jugadores[usuarioActual.uid]) {
                contadorActual = jugadores[usuarioActual.uid].puntos || 0;
            } else {
                contadorActual = 0;
            }
            document.getElementById('contadorActual').textContent = contadorActual;
        }

        function mostrarTabla() {
            const contenedor = document.getElementById('tablaContenedor');

            const lista = Object.values(jugadores)
                .sort((a, b) => b.puntos - a.puntos)
                .slice(0, 50);

            if (lista.length === 0) {
                contenedor.innerHTML = '<div class="vacio">Nadie ha jugado todavía. ¡Sé el primero!</div>';
                return;
            }

            let html = '<table><thead><tr><th>#</th><th>Jugador</th><th style="text-align:right">Clicks</th></tr></thead><tbody>';

            lista.forEach((jugador, index) => {
                const pos = index + 1;
                let clasePos = '';
                if (pos === 1) clasePos = 'pos-1';
                else if (pos === 2) clasePos = 'pos-2';
                else if (pos === 3) clasePos = 'pos-3';

                let medalla = pos;
                if (pos === 1) medalla = '🥇';
                else if (pos === 2) medalla = '🥈';
                else if (pos === 3) medalla = '🥉';

                const esActual = usuarioActual && jugador.nombre === usuarioActual.displayName;
                const estiloActual = esActual ? ' style="background:#f0f4ff; font-weight:bold;"' : '';

                const avatarUrl = jugador.foto && jugador.foto.trim() !== ''
                    ? jugador.foto
                    : generarAvatarInicial(jugador.nombre);

                const avatarHtml = `<img src="${avatarUrl}" class="avatar-tabla" 
                    onerror="this.onerror=null; this.src='${generarAvatarInicial(jugador.nombre)}';">`;

                html += `<tr${estiloActual}>
                    <td class="posicion ${clasePos}">${medalla}</td>
                    <td>${avatarHtml}${jugador.nombre}</td>
                    <td class="puntos">${jugador.puntos}</td>
                </tr>`;
            });

            html += '</tbody></table>';
            contenedor.innerHTML = html;
        }
    </script>
</body>
</html>
